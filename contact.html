<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background:linear-gradient(135deg, rgba(154, 211, 238, 0.6),rgba(248, 250, 250, 0.5));
                color:#333;
            }

            
        .header{
    width:100%;
    background:#fff;
    position:sticky;
    top:0;
    z-index:999;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:10px 20px;
    text-decoration: none;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
}


.logo img{
    height: 80px;
    width: 180px;
}

.nav-links{
    display:flex;
    gap:35px;
    text-decoration: none;
    list-style : none;
}

.nav-links a{
    color:#333;
    style:none;
    align-items: center; 
    font-weight:500;
    transition:.3s;
    text-decoration: none;
}

.nav-links a:hover,
.nav-links .active{
    color:#0f4c81;
}

.nav-btn{
    display:flex;
    align-content: center;

}
.btn-outline1{
    display:inline;
    border:2px solid #0f4c81;
    color:#0f4c81;
    padding:12px 30px;
    border-radius:30px;
    transition:.3s;
    margin-left:15px;
}

.btn-outline1:hover{

    color:black;
}

        .hamburger {
            display: none;
            cursor: pointer;
            width: 32px;
            height: 24px;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4px;
            background: none;
            border: none;
            z-index: 1001;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: navy;
            border-radius: 3px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

            .contact-section {
                padding: 60px 20px;
            }

            .container {
                max-width: 800px;
                margin: auto;
                background-color: #fff;
                padding: 40px;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0, 123, 255, 0.1);
            }

            h1 {
                color: #007bff;
                text-align: center;
                margin-bottom: 10px;
            }

            p {
                text-align: center;
                margin-bottom: 30px;
                color:#666;
            }

            .form-row {
                display: flex;
                gap:  20px;

            }

            .form-group {
                flex: 1;
                margin-bottom: 20px;
                display: flex;
                flex-direction: column;
            }

            label {
                font-weight: 600;
                margin-bottom: 8px ;
                color: #444;
            }

            input,
            select,
            textarea {
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 16px;
                outline: none;
                transition: 0.3s;
            }

            input:focus,
            select:focus,
            textarea:focus {
                border-color: #007bff;
            }

            .btn-submit {
                width:100%;
                padding: 14px;
                background-color: #007bff;
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 18px;
                cursor: pointer;
                transition: 0.3s;
            }

            .btn-submit:hover {
                background-color: #0056b3;
            }

            .hospital-info {
                margin-top: 30px;;
                text-align: center;
                background-color: #d9e1ec;
                padding: 15px;
                border-radius: 8px;
                width: 810px;
                margin-left: 255px;
            }

            

            @media(max-width: 768px) {
                .navbar {
                    padding: 15px 20px;
                    flex-wrap: wrap;
                }

                .logo img {
                    height: 60px;
                    width: 140px;
                }

                .nav-links {
                    position: absolute;
                    top: 100%;
                    left: 0;
                    right: 0;
                    flex-direction: column;
                    gap: 0;
                    background-color: white;
                    padding: 10px 20px 16px;
                    display: none;
                    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
                    z-index: 1000;
                }

                .nav-links.open {
                    display: flex;
                }

                .nav-links li {
                    width: 100%;
                }

                .nav-links a {
                    display: block;
                    width: 100%;
                    padding: 12px 0;
                    border-bottom: 1px solid #f0f0f0;
                }

                .btn-outline1 {
                    display: inline-block;
                    margin: 10px 0 0;
                    text-align: center;
                }

                .hamburger {
                    display: flex;
                    position: absolute;
                    right: 20px;
                    top: 50%;
                    transform: translateY(-50%);
                }

                .contact-section {
                    padding: 60px 20px;
                }

                .container {
                    padding: 30px 20px;
                    
                }

                .form-row {
                    flex-direction: column;
                    gap: 0;
                }

                .hospital-info {
                    width: 100%;
                    margin-left: 0;
                }
            }
        </style>
    </head>
    <body>

       <header class="header">

        <nav class="navbar">

            <!-- Logo -->
            <div class="logo">
                <img src="vitality.png" class="img">
            </div>

            <button class="hamburger" type="button" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Navigation -->
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">Aboutus</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="testimonials.html">Testimonials</a></li>
                <li><a href="doctors.html">Therapists Directory</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li>
                    <a href="appointment.html" class="btn-outline1">
                        Book Appointment
                    </a>
                </li>
            </ul>
        </nav>

    </header>


        <section class="contact-section">
            <div class="container">
                <h1>Contact</h1>
                <p>Have a question or need an appointment? We are here 24/7 to help you.</p>

                <form id="contactForm" class="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full Name*</label>
                            <input type="text" id="name" name="name" placeholder="enter your name" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Number*</label>
                            <input type="number" id="phone" name="phone" placeholder="enter your number" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" name="email" placeholder="enter your email" required>
                    </div>

    

                        <div class="form-group">
                            <label for="appointment">Appointment Date</label>
                            <input type="date" id="appointment" name="appointment">
                        </div>
                    

                    <div class="form-group">
                        <label for="message">Message*</label>
                        <textarea id="message" name="message" rows="5" placeholder="describe your concern" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Send Message</button>
                    
                </form>
            </div>

                <div class="hospital-info">
                    <h3>Emergency Contact</h3><br>
                    <p>&#128222;   123456789  |  &#9993;   help@vitality   | &#128205;   nagpur, Maharastra</p>
                </div>
            </div>
        </section>
        
        <script>
            document.getElementById('contactForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const name = document.getElementById('name').value;
                alert('Thank you ' + name + '! Your message has been sent. Our team will contact you soon.');

                this.reset();
            });

            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-links');

            if (hamburger && navMenu) {
                hamburger.addEventListener('click', function() {
                    const expanded = this.getAttribute('aria-expanded') === 'true';
                    this.setAttribute('aria-expanded', String(!expanded));
                    navMenu.classList.toggle('open');
                    this.classList.toggle('active');
                });

                document.querySelectorAll('.nav-links a').forEach(function(link) {
                    link.addEventListener('click', function() {
                        if (navMenu.classList.contains('open')) {
                            navMenu.classList.remove('open');
                            hamburger.classList.remove('active');
                            hamburger.setAttribute('aria-expanded', 'false');
                        }
                    });
                });
            }
        </script>

    </body>
</html>
